        description: | # this will include new lines to allow paragraphs
          **사용 기술 :**
          Python, Pytorch, Huggingface, Faiss

          **주요 기능 :**
          CLIP 모델을 이용한 이미지 벡터화 및 Faiss 를 이용한 유사도 검색

          **상세 설명 :**
          CLIP은 이미지와 텍스트를 같은 벡터 공간에 임베딩하여 유사도를 계산할 수 있게 해줍니다.
          FAISS는 Facebook AI Research에서 개발한 라이브러리로, 대규모 벡터 데이터셋에서 빠른 유사도 검색을 수행할 수 있습니다.
          CLIP으로 생성된 벡터들을 FAISS 인덱스에 저장하고 검색하는 방식으로 활용됩니다.

          **Link :**
          <a href="https://canyon-nickel-820.notion.site/CLIP-FAISS-1bcdb14395b7802780ead79214068fbf?pvs=73">[notion] CLIP + FAISS 유사검색(한글지원)</a>

