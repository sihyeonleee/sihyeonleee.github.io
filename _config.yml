content:
  - title: Career
    layout: list
    content:
      - layout: left
        border: weak
        title: 도전하는사람들
        caption: 2025. 11. 24 ~ 현재
        quote: >
          관리 웹·모니터링 개발 및 운영 인프라 구축
        description: |
          **DO.LiNKER · 시스템 간 메시지 연계를 위한 ESB 플랫폼**

          - 연계 시스템별 처리 현황과 평균 처리시간을 확인하는 운영 대시보드를 개발하고, 현황 조회에서 메시지 본문을 제외해 조회 데이터량을 줄였습니다.
          - Observer의 API·SQL 로그 수집부터 관리 웹의 검색·필터·상세 조회까지 구현했습니다.
          - 서버 네트워크·디스크 I/O 수집과 헬스 체크를 추가하고, 요청 타임아웃과 실패를 구분하도록 개선했습니다.
          - Windows Server Failover Clustering(WSFC)을 구성하고 Jenkins로 배포를 자동화했습니다.

          **기술** · Java, Spring Boot, PostgreSQL, WSFC, Jenkins

      - layout: left
        border: weak
        title: 가을엔터테인먼트
        sub_title: 웹개발팀 대리
        caption: 2024. 10 ~ 2025. 09 (1년)
        quote: >
          Java Spring Boot 웹개발
        description: |
          **1. 조이팬 · 팬과 크리에이터를 위한 커뮤니티**
          ---
          - **주요 업무:** 
          커뮤니티 서비스의 요구사항 분석, 데이터베이스 설계 및 웹 개발

          - **서버 구성:** 
          ncp, docker v27.3, apache v2.4, tomcat v11, spring boot v3.3, next.js v14.2, mysql v10.3, redis v7.4

          - **참여 내용:**
            1. Mysql ERD 설계, 개발(next, chat, util, api), 서버 구축(ncp)
            2. NCP 클라우드 : ubuntu, object storage, vod station/channel, global edge(cdn), sub account
            3. Api 연동 : sns(google, kakao, naver, twitter), nicepay(결제), niceapi(인증), nurigo(메신저), postfix(이메일)

          - **`기여`:**

            관리자, 콘텐츠 매니저, 크리에이터, 사용자 화면과 기능 개발
            - Next SPA 활용하여 파일 Chunk 업로드 구현, jotai(recoil) 를 이용한 상태관리
            - 로그인 개발 : Spring Security, Json Web Token
            - 스케쥴링 개발 : 월 구독결제, 월 자동정산
            - 실시간 알림 및 이메일 전송 : postfix + redis pub/sub
            - 실시간 채팅 개발 : socket, redis 클러스터링
            - VOD Station, CDN, HLS를 적용한 영상 재생 구현
            - WebGL·Canvas 기반 비디오 플레이어에 워터마크 적용

      - layout: left
