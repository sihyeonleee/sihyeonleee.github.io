about_content: | # this will include new lines to allow paragraphs
  Spring Boot 기반 관리 웹과 운영 모니터링을 개발합니다. 현재는 ESB 플랫폼 DO.LiNKER에서 대시보드와 로그 조회 화면, 모니터링 데이터 수집 기능을 맡고 있으며, WSFC 구성과 Jenkins 배포 자동화도 담당했습니다.

  이전에는 커뮤니티 서비스, Elasticsearch 검색 시스템, 온라인 교육 플랫폼을 개발했습니다.

